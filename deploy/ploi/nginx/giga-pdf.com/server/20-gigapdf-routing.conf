# GigaPDF — routage du domaine principal sur l'hôte Ploi.
#
# Installé dans /etc/nginx/ploi/giga-pdf.com/server/ par
# deploy/ploi/install-nginx-routing.sh. Ploi inclut ce dossier DANS le bloc
# `server` qu'il génère (dont le `location /` envoie tout vers Next :3000) et
# conserve ces fichiers quand il régénère la configuration du site.
#
# Pourquoi : le frontend appelle l'API en même origine (API_BASE_URL = "",
# NEXT_PUBLIC_API_URL non défini). Sans ces règles, /api/v1/*, /socket.io/ et
# /webhooks/* tombaient sur Next → page 404 HTML (incident 2026-10-27 :
# « HTTP 404 » sur /developers, quotas, documents…).
#
# Les `location` nginx sont choisies par préfixe le plus long, pas par ordre :
# ces blocs l'emportent sur le `location /` de Ploi sans le dupliquer.

# conf.d/upload.conf de l'hôte fixe 2M globalement : trop bas pour les PDF
# envoyés à /api/pdf/* (Next) et /api/v1/* (FastAPI). Même plafond que
# api.giga-pdf.com.
client_max_body_size 300M;
client_body_timeout 300s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# --- FastAPI (127.0.0.1:8000) -------------------------------------------------
# FastAPI expose uniquement /api/v1, /api/docs, /api/redoc, /webhooks et
# /socket.io (app/main.py). Tout le reste, y compris /api/pdf, /api/auth,
# /api/office, reste à Next via le `location /` de Ploi.

# Seule route /api/v1 servie par Next (correspondance exacte, prioritaire).
location = /api/v1/embed/validate-key {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location /api/v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location /api/docs {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/redoc {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /webhooks/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Collaboration temps réel (présence, verrous, curseurs).
location /socket.io/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

# --- Next admin (127.0.0.1:3001, basePath /admin en production) --------------
location /admin {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_redirect ~^(https?)://[^/]+:3001(/.*)?$ https://$host$2;
}
